<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <!-- Wall poster: the Sun and the eight planets, each on its own orbit (not to scale) -->
  <defs><clipPath id="card"><rect x="3" y="3" width="114" height="174" rx="4"/></clipPath></defs>
  <rect x="2" y="2" width="116" height="176" rx="5" fill="#1f2a4d" stroke="#e2dccb" stroke-width="3"/>
  <g clip-path="url(#card)">
    <g fill="#fff"><circle cx="20" cy="40" r="1"/><circle cx="104" cy="58" r="1.2"/><circle cx="62" cy="160" r="1"/><circle cx="12" cy="150" r="1.2"/><circle cx="108" cy="100" r="1"/><circle cx="10" cy="76" r="1"/><circle cx="58" cy="34" r="1"/></g>
    <!-- Orbits (radius 70 to 172 around the Sun at 60, 214) -->
    <g fill="none" stroke="#fff" stroke-opacity=".16">
      <circle cx="60" cy="214" r="70"/><circle cx="60" cy="214" r="80"/><circle cx="60" cy="214" r="92"/><circle cx="60" cy="214" r="104"/>
      <circle cx="60" cy="214" r="122"/><circle cx="60" cy="214" r="138"/><circle cx="60" cy="214" r="156"/><circle cx="60" cy="214" r="172"/>
    </g>
    <!-- Sun peeking up from the bottom -->
    <circle cx="60" cy="214" r="54" fill="#f5c431"/>
    <circle cx="60" cy="214" r="60" fill="none" stroke="#f5c431" stroke-opacity=".35" stroke-width="5"/>
    <!-- Mercury, Venus, Earth, Mars -->
    <circle cx="42" cy="146" r="2.5" fill="#b9b2a8"/>
    <circle cx="87" cy="139" r="3.6" fill="#e9c27a"/>
    <circle cx="21" cy="131" r="4" fill="#3d8ee0"/>
    <circle cx="92" cy="115" r="3" fill="#d9603b"/>
    <!-- Jupiter, Saturn, Uranus, Neptune -->
    <circle cx="26" cy="97" r="9" fill="#e8b98a"/>
    <path d="M18 94h16M17.5 99h17" stroke="#c98a5a" stroke-width="1.6"/>
    <circle cx="89" cy="79" r="7" fill="#f0d27a"/>
    <ellipse cx="89" cy="80" rx="14" ry="3.5" fill="none" stroke="#c9a24a" stroke-width="1.8" transform="rotate(-14 89 80)"/>
    <circle cx="36" cy="60" r="5" fill="#9fe3e8"/>
    <circle cx="84" cy="44" r="5" fill="#4a6fe0"/>
  </g>
  <rect x="22" y="9" width="76" height="16" rx="3" fill="#1f2a4d"/>
  <text x="60" y="21" text-anchor="middle" font-family="Nunito Sans, Arial, sans-serif" font-weight="800" font-size="11" fill="#f5c431">SOLAR SYSTEM</text>
</svg>
